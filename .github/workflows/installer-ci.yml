name: Installer checks
on:
  push:
    paths: [manage.sh, scripts/**, tests/**, Dockerfile, compose.yaml, .dockerignore, hl_lifx_control.py, lifx_db.py]
  pull_request:
    paths: [manage.sh, scripts/**, tests/**, Dockerfile, compose.yaml, .dockerignore, hl_lifx_control.py, lifx_db.py]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n manage.sh
      - run: python3 -m unittest discover -s tests -v
      - run: docker compose -f compose.yaml config --quiet
