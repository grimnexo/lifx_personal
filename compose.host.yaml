services:
  lifx:
    build: .
    image: lifx-personal:local
    restart: unless-stopped
    init: true
    # Native Linux host network: best available path for LAN UDP broadcast discovery.
    # No ports: mapping here; host networking does not support published ports.
    network_mode: host
    user: "${LIFX_UID:-1000}:${LIFX_GID:-1000}"
    environment:
      PORT: "${PORT:-8080}"
      LIFX_DATA_DIR: /data
      LIFX_REQUIRE_ADMIN: "1"
    volumes:
      - type: bind
        source: .
        target: /data
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT','8080') + '/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
